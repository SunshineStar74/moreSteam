# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# The JDK that Gradle itself runs on is chosen in gradle/gradle-daemon-jvm.properties (Java 21).


## Environment Properties

# Versions below match the modpack this mod is built for.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# The pack's mods need at least this NeoForge version (highest minimum of any mod in it).
neo_version=21.1.238
# Same lower bound as Create 6.0.10 itself.
neo_version_range=[21.1.219,)
loader_version_range=[1,)

# Parchment adds parameter names and javadoc on top of the official Mojang names.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Create 6.0.10; build 280 is the one published as create-1.21.1-6.0.10.jar.
create_version=6.0.10-280
# The mixins target Create internals, so only the 6.0.x line is accepted.
create_version_range=[6.0.10,6.1.0)
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=moresteam
mod_name=More Steam
mod_license=All Rights Reserved
mod_version=1.4.6
mod_group_id=com.sunshinestar.moreSteam
mod_authors=SunshineStar74
mod_description=Adds more steam to Create train bogeys.
